name: Create issues from issues.txt

on:
  workflow_dispatch:  # lets you trigger it manually

jobs:
  create_issues:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read issues.txt
        id: read_issues
        run: |
          echo "issues<<EOF" >> $GITHUB_OUTPUT
          cat issues.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create issues
        uses: actions/github-script@v7
        with:
          script: |
            const issues = `${{ steps.read_issues.outputs.issues }}`.split('\n').filter(Boolean);
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
            });
            for (const title of issues) {
              const exists = existing.some(i => i.title === title);
              if (!exists) {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body: 'Auto-created from issues.txt via GitHub Actions',
                  labels: ['automation']
                });
                console.log(`✅ Created issue: ${title}`);
              } else {
                console.log(`⚠️ Skipped duplicate issue: ${title}`);
              }
            }
