name: Create issues from issues.txt

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  create_issues:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Read file content safely without using heredoc output syntax
      - name: Read issues.txt
        id: read_issues
        run: |
          if [ ! -f issues.txt ]; then
            echo "issues.txt not found!"
            exit 1
          fi
          echo "issues=$(cat issues.txt | tr '\n' ',' | sed 's/,$//')" >> $GITHUB_OUTPUT

      - name: Create issues from list
        uses: actions/github-script@v7
        with:
          script: |
            const raw = `${{ steps.read_issues.outputs.issues }}`.split(',').map(s => s.trim()).filter(Boolean);
            if (raw.length === 0) {
              core.info("No issue titles found in issues.txt");
              return;
            }

            let existing = [];
            for (let page = 1; page <= 3; page++) {
              const { data } = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'all',
                per_page: 100,
                page
              });
              existing = existing.concat(data);
              if (data.length < 100) break;
            }

            const existingTitles = new Set(existing.map(i => i.title));

            for (const title of raw) {
              if (existingTitles.has(title)) {
                core.info(`⚠️ Skipped duplicate: ${title}`);
                continue;
              }
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: 'Auto-created from issues.txt via GitHub Actions',
                labels: ['automation']
              });
              core.info(`✅ Created: ${title}`);
            }
